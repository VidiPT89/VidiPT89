name: Update Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Render streak-stats.svg
        run: |
          URL="https://streak-stats.demolab.com/?user=VidiPT89&theme=dark&hide_border=true&background=0A0A0F&ring=D97706&fire=D97706&currStreakLabel=FBBF24&currStreakNum=FFFFFF&sideNums=E2E8F0&sideLabels=94A3B8&dates=64748B&stroke=D97706"
          for i in $(seq 1 15); do
            curl -sSL --max-time 30 -o /tmp/streak.svg "$URL" || { echo "attempt $i: request failed"; sleep 8; continue; }
            if grep -q "<svg" /tmp/streak.svg && ! grep -qi "failed to retrieve" /tmp/streak.svg; then
              cp /tmp/streak.svg assets/streak-stats.svg
              echo "attempt $i: got a valid render"
              exit 0
            fi
            echo "attempt $i: got an error SVG (GitHub API issue), retrying..."
            sleep 8
          done
          echo "Could not get a valid streak render after 15 attempts, keeping the previous file" >&2
          exit 1

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          git diff --cached --quiet || git commit -m "chore: update streak-stats.svg"
          git push
