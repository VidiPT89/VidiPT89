name: Update Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Render streak-stats.svg
        run: |
          curl -sSL --retry 8 --retry-all-errors --retry-delay 10 --max-time 30 \
            -o assets/streak-stats.svg \
            "https://streak-stats.demolab.com/?user=VidiPT89&theme=dark&hide_border=true&background=0A0A0F&ring=D97706&fire=D97706&currStreakLabel=FBBF24&currStreakNum=FFFFFF&sideNums=E2E8F0&sideLabels=94A3B8&dates=64748B&stroke=D97706"
          grep -q "<svg" assets/streak-stats.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          git diff --cached --quiet || git commit -m "chore: update streak-stats.svg"
          git push
